<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#151B34"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFC"/>
      <stop offset="1" stop-color="#27D7E5"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B8A"/>
      <stop offset="1" stop-color="#FFB84D"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30D5A3"/>
      <stop offset="1" stop-color="#2C8CFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <style>
      .sans { font-family: Inter, SF Pro Display, Helvetica Neue, Arial, sans-serif; }
      .label { fill:#8E99BA; font-size:18px; font-weight:700; letter-spacing:2px; }
      .title { fill:#F8FAFF; font-size:40px; font-weight:750; }
      .desc { fill:#AAB4D0; font-size:18px; font-weight:450; }
      .word { fill:#F8FAFF; font-size:42px; font-weight:760; letter-spacing:-1.2px; }
      .tag { fill:#98A4C3; font-size:16px; font-weight:500; }
      .num { fill:#66728F; font-size:18px; font-weight:750; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1425" cy="-20" r="300" fill="#714EF5" opacity=".08"/>
  <circle cx="70" cy="960" r="250" fill="#23D1DF" opacity=".05"/>

  <g class="sans">
    <text x="90" y="90" class="label">UTASTREAM · LOGO EXPLORATION</text>
    <text x="90" y="145" class="title">Music first. Meaning when you want it.</text>
    <text x="90" y="183" class="desc">Three visual directions connecting Japanese lyrics, continuous listening, and discovery.</text>

    <!-- Concept 01: Flow U -->
    <g transform="translate(70 240)">
      <rect width="460" height="610" rx="30" fill="#171E38" stroke="#2B3558" filter="url(#shadow)"/>
      <text x="34" y="48" class="num">01</text>
      <text x="78" y="48" class="label">FLOW U</text>
      <g transform="translate(105 95)">
        <rect width="250" height="250" rx="62" fill="#0D1328"/>
        <path d="M55 72v69c0 45 27 73 70 73s70-28 70-73V72" fill="none" stroke="url(#flow)" stroke-width="28" stroke-linecap="round"/>
        <path d="M47 113c18-16 34-16 52 0s34 16 52 0 34-16 52 0" fill="none" stroke="#F8FAFF" stroke-width="10" stroke-linecap="round" opacity=".95"/>
        <circle cx="202" cy="60" r="9" fill="#27D7E5"/>
      </g>
      <text x="84" y="398" class="word">uta<tspan fill="#31D3E2">stream</tspan></text>
      <text x="84" y="430" class="tag">hear it · understand it</text>
      <line x1="34" y1="474" x2="426" y2="474" stroke="#2B3558"/>
      <text x="34" y="515" class="desc">A continuous audio wave completes a</text>
      <text x="34" y="542" class="desc">welcoming U. Fluid, modern, and built</text>
      <text x="34" y="569" class="desc">to scale cleanly as an app icon.</text>
    </g>

    <!-- Concept 02: Lyric Bridge -->
    <g transform="translate(570 240)">
      <rect width="460" height="610" rx="30" fill="#171E38" stroke="#2B3558" filter="url(#shadow)"/>
      <text x="34" y="48" class="num">02</text>
      <text x="78" y="48" class="label">LYRIC BRIDGE</text>
      <g transform="translate(105 95)">
        <rect width="250" height="250" rx="62" fill="#0D1328"/>
        <path d="M50 60h112c21 0 38 17 38 38v54c0 21-17 38-38 38h-43l-43 34 9-34H50c-21 0-38-17-38-38V98c0-21 17-38 38-38z" transform="translate(19 -5)" fill="url(#bridge)"/>
        <text x="125" y="142" text-anchor="middle" fill="#0D1328" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="74" font-weight="800">歌</text>
        <path d="M57 192h136" stroke="#F8FAFF" stroke-width="9" stroke-linecap="round"/>
        <path d="M76 216h98" stroke="#F8FAFF" stroke-width="9" stroke-linecap="round" opacity=".6"/>
      </g>
      <text x="76" y="398" class="word">Uta<tspan fill="#FF8B69">Stream</tspan></text>
      <text x="76" y="430" class="tag">lyrics become language</text>
      <line x1="34" y1="474" x2="426" y2="474" stroke="#2B3558"/>
      <text x="34" y="515" class="desc">A lyric bubble pairs the kanji for song</text>
      <text x="34" y="542" class="desc">with translation lines. Expressive and</text>
      <text x="34" y="569" class="desc">clear about the learning proposition.</text>
    </g>

    <!-- Concept 03: Uta Note -->
    <g transform="translate(1070 240)">
      <rect width="460" height="610" rx="30" fill="#171E38" stroke="#2B3558" filter="url(#shadow)"/>
      <text x="34" y="48" class="num">03</text>
      <text x="78" y="48" class="label">UTA NOTE</text>
      <g transform="translate(105 95)">
        <rect width="250" height="250" rx="62" fill="#0D1328"/>
        <path d="M70 52v91c0 31 18 52 55 52s55-21 55-52V52" fill="none" stroke="url(#note)" stroke-width="27" stroke-linecap="round"/>
        <path d="M180 52v82" stroke="#36CFAD" stroke-width="17" stroke-linecap="round"/>
        <path d="M180 52l43-11v27l-43 11z" fill="#36CFAD"/>
        <ellipse cx="159" cy="160" rx="28" ry="22" transform="rotate(-15 159 160)" fill="#F8FAFF"/>
        <path d="M59 115h34M59 140h42" stroke="#F8FAFF" stroke-width="8" stroke-linecap="round" opacity=".75"/>
      </g>
      <text x="75" y="398" class="word">utastream<tspan fill="#35CCA9">.</tspan></text>
      <text x="75" y="430" class="tag">your music, understood</text>
      <line x1="34" y1="474" x2="426" y2="474" stroke="#2B3558"/>
      <text x="34" y="515" class="desc">A friendly U becomes a music note, with</text>
      <text x="34" y="542" class="desc">lyric lines tucked into the monogram.</text>
      <text x="34" y="569" class="desc">Distinctive, compact, and playful.</text>
    </g>

    <!-- Footer swatches -->
    <g transform="translate(90 910)">
      <text y="8" class="label">PALETTE</text>
      <circle cx="135" cy="0" r="15" fill="#7C5CFC"/><circle cx="175" cy="0" r="15" fill="#27D7E5"/>
      <circle cx="235" cy="0" r="15" fill="#FF6B8A"/><circle cx="275" cy="0" r="15" fill="#FFB84D"/>
      <circle cx="335" cy="0" r="15" fill="#30D5A3"/><circle cx="375" cy="0" r="15" fill="#2C8CFF"/>
      <text x="430" y="8" class="tag">Dark-first · high contrast · accessible at small sizes</text>
    </g>
  </g>
</svg>
